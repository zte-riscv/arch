name: RISC-V Disassembler Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  riscv-test:
    name: RISC-V Disassembler Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: Build RISC-V binutils from source
        run: |
          set -e

          # Ubuntu 24.04 (Noble) only ships binutils 2.42 in its repos,
          # which does NOT support Zacas and other newer RISC-V extensions.
          # Build binutils 2.44 from source (~3-5 min) for reliable CI.
          BINUTILS_VERSION="2.44"
          INSTALL_DIR="/opt/riscv64-toolchain"

          echo "=== Installing build dependencies ==="
          sudo apt update -qq
          sudo apt install -y -qq build-essential texinfo flex bison
          echo ""

          echo "=== Building GNU binutils ${BINUTILS_VERSION} for riscv64-linux-gnu ==="
          echo ""

          # Download
          wget -q "https://ftp.gnu.org/gnu/binutils/binutils-${BINUTILS_VERSION}.tar.xz"
          echo "Downloaded binutils-${BINUTILS_VERSION}.tar.xz"

          # Extract
          tar xf "binutils-${BINUTILS_VERSION}.tar.xz"
          cd "binutils-${BINUTILS_VERSION}"

          # Configure — only build binutils, skip gdb/gdbserver to save time
          echo "=== Configuring ==="
          mkdir build && cd build
          ../configure \
            --target=riscv64-linux-gnu \
            --prefix="${INSTALL_DIR}" \
            --disable-gdb \
            --disable-gdbserver \
            --disable-nls \
            --disable-werror

          # Build
          echo "=== Building (using $(nproc) jobs) ==="
          make -j$(nproc)

          # Install
          echo "=== Installing ==="
          sudo make install

          # Add to PATH for subsequent steps
          echo "${INSTALL_DIR}/bin" >> "${GITHUB_PATH}"

          cd ../..
          echo ""
          echo "=== Installed toolchain version ==="
          "${INSTALL_DIR}/bin/riscv64-linux-gnu-objdump" --version
          echo ""
          echo "=== Supported RISC-V targets ==="
          "${INSTALL_DIR}/bin/riscv64-linux-gnu-objdump" -i | grep riscv || true

      - name: Install stringer
        run: |
          go install golang.org/x/tools/cmd/stringer@latest
          echo "stringer installed at: $(which stringer)"

      - name: go generate
        working-directory: riscv64/riscv64asm
        run: |
          echo "=== Running go generate ==="
          go generate ./...
          echo "go generate completed"

      # ──── Static unit tests (no objdump needed) ────
      - name: Static Unit Tests
        working-directory: riscv64/riscv64asm
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  STATIC UNIT TESTS (testdata/*.txt)                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "=== TestDecodeGNUSyntax ==="
          go test -run '^TestDecodeGNUSyntax$' -v -count=1 2>&1
          echo ""
          echo "=== TestDecodeGoSyntax ==="
          go test -run '^TestDecodeGoSyntax$' -v -count=1 2>&1

      # ──── Objdump cross-validation tests ────
      - name: Objdump Comparison Tests (GNU Syntax)
        working-directory: riscv64/riscv64asm
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  OBJDUMP CROSS-VALIDATION: GNU SYNTAX                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "=== TestObjdumpRISCV64TestDecodeGNUSyntaxdata ==="
          go test -run '^TestObjdumpRISCV64TestDecodeGNUSyntaxdata$' -v -count=1 2>&1

      - name: Objdump Comparison Tests (Plan9 Syntax)
        working-directory: riscv64/riscv64asm
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  OBJDUMP CROSS-VALIDATION: PLAN9 SYNTAX                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "=== TestObjdumpRISCV64TestDecodeGoSyntaxdata ==="
          go test -run '^TestObjdumpRISCV64TestDecodeGoSyntaxdata$' -v -count=1 2>&1

      - name: Objdump Comparison Tests (Manual Cases)
        working-directory: riscv64/riscv64asm
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  OBJDUMP CROSS-VALIDATION: MANUAL TEST CASES                ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "=== TestObjdumpRISCV64Manual ==="
          go test -run '^TestObjdumpRISCV64Manual$' -v -count=1 2>&1

      # ──── Final summary ────
      - name: Test Summary
        if: always()
        working-directory: riscv64/riscv64asm
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  FULL TEST SUITE SUMMARY                                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          go test -v -count=1 -timeout 10m ./... 2>&1
